<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <!-- Subtle background tint helps the flower pop in browser tabs against any tab color -->
  <circle cx="70" cy="70" r="68" fill="#f0e3f5"/>
  <g transform="translate(70,70)">
    <!-- outer petals (lavender) -->
    <ellipse cx="0" cy="-32" rx="18" ry="32" fill="#b89ec9" stroke="#6b3f7a" stroke-width="2" opacity="0.95"/>
    <ellipse cx="32" cy="0" rx="32" ry="18" fill="#b89ec9" stroke="#6b3f7a" stroke-width="2" opacity="0.95"/>
    <ellipse cx="0" cy="32" rx="18" ry="32" fill="#b89ec9" stroke="#6b3f7a" stroke-width="2" opacity="0.95"/>
    <ellipse cx="-32" cy="0" rx="32" ry="18" fill="#b89ec9" stroke="#6b3f7a" stroke-width="2" opacity="0.95"/>
    <!-- diagonals (lilac) -->
    <ellipse cx="22" cy="-22" rx="20" ry="26" transform="rotate(45 22 -22)" fill="#d9c4e6" stroke="#6b3f7a" stroke-width="1.6" opacity="1"/>
    <ellipse cx="22" cy="22" rx="20" ry="26" transform="rotate(135 22 22)" fill="#d9c4e6" stroke="#6b3f7a" stroke-width="1.6" opacity="1"/>
    <ellipse cx="-22" cy="22" rx="20" ry="26" transform="rotate(45 -22 22)" fill="#d9c4e6" stroke="#6b3f7a" stroke-width="1.6" opacity="1"/>
    <ellipse cx="-22" cy="-22" rx="20" ry="26" transform="rotate(135 -22 -22)" fill="#d9c4e6" stroke="#6b3f7a" stroke-width="1.6" opacity="1"/>
    <!-- center (honey gold) -->
    <circle cx="0" cy="0" r="14" fill="#d4a574" stroke="#6b3f7a" stroke-width="1.2"/>
    <circle cx="-4" cy="-4" r="4" fill="#fff8e7" opacity="0.7"/>
  </g>
</svg>
